<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>与那原お助け</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f7;--ink:#14303b;--sub:#5b7380;--line:#cfdcda;--ai:#1f4d78;--ai-d:#16395a;--sun:#f0c04a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Meiryo",sans-serif;line-height:1.7}
header{background:var(--ai);color:#fff;padding:20px 16px 18px;border-bottom:5px solid var(--sun)}
header h1{margin:0;font-size:1.5rem}
header p{margin:2px 0 0;font-size:.9rem;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
section{margin-bottom:28px}
h2{font-size:1.1rem;margin:0 0 10px}
label{display:block;font-size:.85rem;color:var(--sub);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
textarea{min-height:80px}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--ai);color:#fff;margin-top:12px}
button:hover{background:var(--ai-d)}
button.sub{background:#fff;color:var(--ai);border:1px solid var(--ai)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:1rem}
.meta{font-size:.82rem;color:var(--sub)}
.tag{display:inline-block;background:var(--sun);color:var(--ink);border-radius:4px;padding:0 8px;font-size:.8rem;margin-right:6px}
#msg{min-height:1.5em;font-size:.9rem;color:var(--ai-d);margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>与那原お助け</h1>
  <p>近所で手伝い合う、与那原の会員制の掲示板</p>
</header>
<main>
  <div id="msg" role="status"></div>

  <!-- ログイン前 -->
  <section id="authBox">
    <h2>ログインまたは新規登録</h2>
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">パスワード(6文字以上)</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">ログイン</button>
    <button id="signupBtn" class="sub">新規登録</button>
  </section>

  <!-- ログイン後 -->
  <div id="appBox" hidden>
    <section class="row">
      <span class="meta" id="who"></span>
      <button id="logoutBtn" class="sub" style="margin-top:0">ログアウト</button>
    </section>

    <section>
      <h2>お願いを投稿する</h2>
      <label for="category">種類</label>
      <select id="category">
        <option value="cat">猫の預かり</option>
        <option value="dog">犬の散歩</option>
        <option value="cleaning">部屋の掃除</option>
        <option value="childcare">育児の協力</option>
        <option value="pickup">子どものお迎え</option>
        <option value="other">その他</option>
      </select>
      <label for="title">タイトル</label>
      <input id="title" maxlength="60" placeholder="例: 土曜の朝、犬の散歩をお願いしたい">
      <label for="description">くわしい内容(住所や電話番号は書かないでください)</label>
      <textarea id="description"></textarea>
      <label for="area">地域(町名まで)</label>
      <input id="area" placeholder="例: 与那原">
      <label for="wanted_date">希望日</label>
      <input id="wanted_date" type="date">
      <button id="postBtn">投稿する</button>
    </section>

    <section>
      <h2>募集中のお願い</h2>
      <div id="list"></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ★ここにPublishable keyを貼ってください(Secret keyは絶対に貼らない)
const SUPABASE_URL = "https://twtlhfyksfxuancbipck.supabase.co";
const SUPABASE_KEY = "sb_publishable_xTUyTf8UY60RQXsG9UsuZg_Rrs1f4Oj";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = {cat:"猫の預かり",dog:"犬の散歩",cleaning:"部屋の掃除",childcare:"育児の協力",pickup:"子どものお迎え",other:"その他"};
const $ = id => document.getElementById(id);
let me = null;

function say(t){ $("msg").textContent = t || ""; }

async function refresh(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session ? session.user : null;
  $("authBox").hidden = !!me;
  $("appBox").hidden = !me;
  if(me){ $("who").textContent = me.email + " でログイン中"; loadList(); }
}

$("signupBtn").onclick = async () => {
  const { data, error } = await sb.auth.signUp({ email:$("email").value, password:$("password").value });
  if(error) return say("登録できませんでした: " + error.message);
  say(data.session ? "登録しました。" : "確認メールを送りました。メール内のリンクを開いてからログインしてください。");
  refresh();
};
$("loginBtn").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value, password:$("password").value });
  if(error) return say("ログインできませんでした: " + error.message);
  say(""); refresh();
};
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); say("ログアウトしました。"); refresh(); };

$("postBtn").onclick = async () => {
  const title = $("title").value.trim();
  if(!title) return say("タイトルを入力してください。");
  const { error } = await sb.from("requests").insert({
    requester_id: me.id, category: $("category").value, title,
    description: $("description").value.trim() || null,
    area: $("area").value.trim() || null,
    wanted_date: $("wanted_date").value || null
  });
  if(error) return say("投稿できませんでした: " + error.message);
  ["title","description","area","wanted_date"].forEach(i => $(i).value = "");
  say("投稿しました。"); loadList();
};

async function loadList(){
  const { data, error } = await sb.from("requests").select("*").eq("status","open").order("created_at",{ascending:false});
  const box = $("list"); box.textContent = "";
  if(error) return say("一覧を取得できませんでした: " + error.message);
  if(!data.length){ box.textContent = "まだ投稿はありません。最初のお願いを投稿してみましょう。"; return; }
  data.forEach(r => {
    const c = document.createElement("div"); c.className = "card";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = CATS[r.category] || r.category;
    const h = document.createElement("h3"); h.textContent = r.title;
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = [r.area, r.wanted_date && ("希望日 " + r.wanted_date)].filter(Boolean).join(" / ");
    c.append(tag, h, m);
    if(r.description){ const d = document.createElement("p"); d.textContent = r.description; c.append(d); }
    if(r.requester_id !== me.id){
      const b = document.createElement("button"); b.textContent = "手伝えます";
      b.onclick = () => apply(r.id); c.append(b);
    } else {
      const own = document.createElement("div"); own.className = "meta"; own.textContent = "あなたの投稿です"; c.append(own);
    }
    box.append(c);
  });
}

async function apply(requestId){
  const message = prompt("依頼者へのひとことを入力してください(任意)");
  if(message === null) return;
  const { error } = await sb.from("applications").insert({ request_id:requestId, helper_id:me.id, message:message || null });
  if(error) return say(error.code === "23505" ? "すでに応募しています。" : "応募できませんでした: " + error.message);
  say("応募しました。");
}

refresh();
</script>
</body>
</html>
