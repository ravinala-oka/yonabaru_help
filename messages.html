<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッセージ</title>
<style>
  :root{
    --bg:#f1f4f4;
    --card:#ffffff;
    --card-head:#f7f9f8;
    --line:#e3e8e8;
    --ink:#161a1b;
    --ink-soft:#6b7778;
    --ink-faint:#8a9596;
    --teal:#0e6e7a;
    --teal-bg:#dcefef;
    --avatar-peach:#f7e9e0;
    --avatar-teal:#e1eff1;
    --pill-gray:#eceeee;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); }
  body{
    font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .msg-page{ max-width:640px; margin:0 auto; padding:24px 0 40px; }

  /* ---------- 見出し ---------- */
  .msg-title{
    margin:0; padding:0 0 0 37px;
    font-size:1.25rem; font-weight:700; letter-spacing:.02em; line-height:1.4;
  }

  /* ---------- タブ ---------- */
  .msg-tabs{
    display:flex; gap:0;
    margin:12px 0 0; padding:0 0 0 25px;
    border-bottom:1px solid var(--line);
  }
  .msg-tab{
    all:unset; cursor:pointer; position:relative;
    padding:12px 14px 12px; font-size:.95rem; color:var(--ink-soft);
    line-height:1.4; white-space:nowrap;
  }
  .msg-tab .count{ font-size:.75rem; color:var(--ink-faint); margin-left:3px; font-weight:400; }
  .msg-tab.is-active{ color:var(--teal); font-weight:700; }
  .msg-tab.is-active .count{ color:var(--teal); font-weight:700; }
  .msg-tab.is-active::after{
    content:""; position:absolute; left:14px; right:14px; bottom:-1px;
    height:2px; background:var(--teal); border-radius:2px;
  }

  /* ---------- スレッドカード ---------- */
  .thread{
    display:block; margin:12px 24px 0 37px;
    background:var(--card); border-radius:16px; overflow:hidden;
  }

  /* 上段：投稿情報 */
  .post-row{
    all:unset; cursor:pointer; box-sizing:border-box;
    display:flex; align-items:center; gap:10px; width:100%;
    padding:12px 14px 12px 12px; min-height:72px;
    background:var(--card-head);
    border-bottom:1px solid var(--line);
  }
  .post-avatar{
    flex:none; width:48px; height:48px; border-radius:12px;
    background:var(--avatar-peach); color:#6f8c8f;
    display:flex; align-items:center; justify-content:center;
    font-size:1.25rem; font-weight:500;
  }
  .post-body{ flex:1; min-width:0; }
  .post-meta{
    display:flex; align-items:center; flex-wrap:wrap;
    font-size:.75rem; color:var(--ink-soft); line-height:1.5;
  }
  .post-meta .dot{ margin:0 5px; }
  .status{
    display:inline-block; margin-left:5px;
    padding:1px 7px; border-radius:8px;
    font-size:.6875rem; font-weight:500; color:var(--teal); background:var(--teal-bg);
    line-height:1.5;
  }
  .post-title{
    margin:1px 0 1px; font-size:1rem; font-weight:700; line-height:1.4; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .post-author{ font-size:.75rem; color:var(--ink-soft); line-height:1.5; }
  .chev{ flex:none; width:16px; height:16px; color:#7d8889; }

  /* 下段：相手とのやりとり */
  .chat-row{
    all:unset; cursor:pointer; box-sizing:border-box;
    display:flex; align-items:flex-start; gap:10px; width:100%;
    padding:14px 28px 14px 25px; background:var(--card);
  }
  .chat-avatar{
    flex:none; width:36px; height:36px; border-radius:10px;
    background:var(--avatar-teal); color:#2c6e78;
    display:flex; align-items:center; justify-content:center;
    font-size:.9rem; font-weight:600;
  }
  .chat-main{ flex:1; min-width:0; }
  .chat-head{ display:flex; align-items:center; gap:6px; line-height:1.4; }
  .chat-name{ font-size:.875rem; font-weight:700; color:var(--ink); }
  .pill{
    display:inline-flex; align-items:center; justify-content:center;
    padding:2px 8px; border-radius:8px; line-height:1.4;
  }
  .pill.role{ background:var(--teal-bg); color:var(--teal); padding:2px 9px; }
  .pill.role svg{ width:13px; height:13px; display:block; }
  .pill.wait{ background:var(--pill-gray); color:var(--ink-soft); font-size:.6875rem; font-weight:500; }
  .chat-last{
    display:flex; align-items:center; gap:3px;
    margin-top:2px; font-size:.8125rem; color:var(--ink-soft); line-height:1.5;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chat-last svg{ width:15px; height:15px; flex:none; display:block; }
  .chat-time{
    flex:none; margin-left:auto; padding-top:1px;
    font-size:.6875rem; color:var(--ink-faint); line-height:1.6; white-space:nowrap;
  }

  @media (max-width:480px){
    .msg-title{ padding-left:20px; }
    .msg-tabs{ padding-left:8px; }
    .thread{ margin:12px 12px 0 12px; }
    .chat-row{ padding-right:16px; padding-left:16px; }
  }
</style>
</head>
<body>
<main class="msg-page">
  <h1 class="msg-title">メッセージ</h1>

  <nav class="msg-tabs" role="tablist" aria-label="メッセージの種類">
    <button class="msg-tab" role="tab" aria-selected="false">自身の投稿<span class="count">4</span></button>
    <button class="msg-tab is-active" role="tab" aria-selected="true">交渉中<span class="count">1</span></button>
    <button class="msg-tab" role="tab" aria-selected="false">友達<span class="count">1</span></button>
  </nav>

  <section class="thread">
    <!-- 上段：投稿情報 -->
    <button class="post-row" type="button">
      <span class="post-avatar" aria-hidden="true">猫</span>
      <span class="post-body">
        <span class="post-meta">
          <span>投稿ID P000001</span><span class="dot">・</span><span>猫の預かり</span>
          <span class="status">募集中</span>
        </span>
        <span class="post-title" style="display:block">test</span>
        <span class="post-author" style="display:block">投稿者: mizuno</span>
      </span>
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
    </button>

    <!-- 下段：相手とのやりとり -->
    <button class="chat-row" type="button">
      <span class="chat-avatar" aria-hidden="true">m</span>
      <span class="chat-main">
        <span class="chat-head">
          <span class="chat-name">mizuno</span>
          <span class="pill role" aria-label="投稿者以外の参加者">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 13.6c.4-2.6 2.6-4.1 5.2-4.1s4.8 1.5 5.2 4.1"/></svg>
          </span>
          <span class="pill wait">返事待ち</span>
        </span>
        <span class="chat-last">
          <span>あなた:</span>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="#fff" stroke="#8b9bd6" stroke-width="1"/>
            <path d="M1.5 4.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2.2h-13z" fill="#7a88d8"/>
            <rect x="4.2" y="1" width="1.4" height="2.8" rx=".7" fill="#5b69c0"/>
            <rect x="10.4" y="1" width="1.4" height="2.8" rx=".7" fill="#5b69c0"/>
            <g fill="#9aa6e2">
              <rect x="3.6" y="8" width="2" height="1.6" rx=".3"/><rect x="7" y="8" width="2" height="1.6" rx=".3"/><rect x="10.4" y="8" width="2" height="1.6" rx=".3"/>
              <rect x="3.6" y="11" width="2" height="1.6" rx=".3"/><rect x="7" y="11" width="2" height="1.6" rx=".3"/><rect x="10.4" y="11" width="2" height="1.6" rx=".3"/>
            </g>
          </svg>
          <span>面談日時のお知らせ</span>
        </span>
      </span>
      <time class="chat-time" datetime="2026-10-04T17:38">10/4 17:38</time>
    </button>
  </section>
</main>

<script>
  // タブの見た目の切り替え（デモ用）
  document.querySelectorAll('.msg-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.msg-tab').forEach(function(t){
        t.classList.toggle('is-active', t === tab);
        t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      });
    });
  });
</script>
</body>
</html>
